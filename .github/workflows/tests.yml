name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg (used to generate test audio)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pyflakes
      - name: Lint
        run: pyflakes lyrics_sync.py tests
      - name: Test
        run: pytest -v
      - name: Check shell scripts
        run: bash -n docker/entrypoint.sh
