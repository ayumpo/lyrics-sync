name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Smoke-test the image (amd64)
        run: |
          docker buildx build --load -t lyrics-sync:ci .
          docker run --rm lyrics-sync:ci --version
          mkdir -p "$RUNNER_TEMP/music/Artist/Album" "$RUNNER_TEMP/config"
          docker run --rm -e PROVIDERS=embedded -e INTERVAL_HOURS=0 \
            -v "$RUNNER_TEMP/music:/music" -v "$RUNNER_TEMP/config:/config" lyrics-sync:ci
          test -s "$RUNNER_TEMP/config/lyrics-sync.log"
          cat "$RUNNER_TEMP/config/lyrics-sync.log"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
